name: devlink
description: DevLink - Connect, Build, Deliver
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  http_parser: ^4.0.2
  image_picker: ^1.0.7
  shared_preferences: ^2.2.3
  intl_phone_field_v2: ^4.0.5
  file_selector: ^1.0.3
  url_launcher: ^6.2.6
  google_sign_in: ^7.2.0
  device_preview: ^1.3.1
  fl_chart: ^0.68.0      
  pdf: ^3.10.8           
  printing: ^5.12.0
  file_saver: ^0.2.14
  geolocator: ^12.0.0
  geolocator_web: ^4.1.4
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Blueprint theme (DESIGN_SYSTEM.md §3): bundled, never loaded from the network.
  # IBM Plex Sans 1.1.0 and IBM Plex Sans Arabic 1.1.0, SIL Open Font License 1.1
  # (assets/fonts/*-OFL.txt); converted from IBM's WOFF files to TTF.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700