name: devlink
description: DevLink - Connect, Build, Deliver
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  http_parser: ^4.0.2
  image_picker: ^1.0.7
  shared_preferences: ^2.2.3
  intl_phone_field_v2: ^4.0.5
  file_selector: ^1.0.3
  url_launcher: ^6.2.6
  google_sign_in: ^7.2.0
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/